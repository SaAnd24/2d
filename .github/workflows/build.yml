name: Build Android APK (desde ZIP)

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir ZIP del proyecto (si existe)
        id: src
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"
            rm -rf _src
            mkdir _src
            unzip -q "$ZIP" -d _src
            SETTINGS=$(find _src -maxdepth 3 -name 'settings.gradle.kts' -not -path '*/__MACOSX/*' | head -n 1)
            test -n "$SETTINGS" || { echo "No se encontró settings.gradle.kts dentro del ZIP"; exit 1; }
            ROOT=$(dirname "$SETTINGS")
          else
            echo "No hay ZIP en la raíz: se usa el proyecto ya descomprimido"
            ROOT=.
          fi
          test -f "$ROOT/settings.gradle.kts"
          echo "Raíz del proyecto: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
